server.port=${PORT:8080}
spring.application.name=finpulse-ai-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ORIGINS}

app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.backend-url=${BACKEND_URL:http://localhost:8080}
spring.mail.port=${SMTP_PORT:2525}
app.mail-from=${MAIL_FROM:}
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.oauth.google-id=${GOOGLE_CLIENT_ID:}
app.oauth.google-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.apple-id=${APPLE_CLIENT_ID:}
app.oauth.apple-secret=${APPLE_CLIENT_SECRET:}
server.servlet.session.cookie.same-site=${SESSION_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_SECURE:false}
server.servlet.session.timeout=10m
app.demo-enabled=${DEMO_ENABLED:true}
